<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fund Transfer · Citizens FAST</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-20 -60 651 558'%3E%3Cpath fill='%238b1c1c' d='M219 0L375 156 339 192 219 73 73 219 219 365 277 309 313 345 219 438 0 219Z M458 130L611 283 458 436 193 171 228 135 458 364 538 284 458 204 404 257 368 221Z'/%3E%3C/svg%3E">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("citizens-theme")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
.fth-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.fth-bar h3, .fth-h { font-size: 15px; font-weight: 600; }
.fth-h { margin: 24px 0 12px; }
.fth-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.fth-card {
  display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 14px; row-gap: 10px; align-items: center;
  padding: 18px; border-radius: var(--r-16); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
  text-decoration: none; color: inherit; cursor: pointer; transition: transform .18s, box-shadow .18s, border-color .18s;
}
.fth-card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,.08); border-color: var(--primary-light); }
.fth-ic { grid-row: 1 / 3; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: #fff; }
.fth-ic svg { width: 22px; height: 22px; }
.fth-ic.czb { background: linear-gradient(135deg, #4a0d12, #8b1c1c); }
.fth-ic.other { background: linear-gradient(135deg, #064e3b, #16a34a); }
.fth-ic.mfs { background: linear-gradient(135deg, #312e81, #6366f1); }
.fth-title b { font-size: 15px; display: block; font-weight: 700; color: var(--text); }
.fth-title small { font-size: 12px; color: var(--muted); }
.fth-card .chip { grid-column: 2; grid-row: 2; justify-self: start; }
.fth-go { grid-column: 3; grid-row: 1 / 3; color: var(--muted); display: grid; transition: transform .18s, color .18s; }
.fth-card:hover .fth-go { color: var(--primary); transform: translateX(3px); }

.fav-track { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.fav-track::-webkit-scrollbar { display: none; }
.fav-card {
  flex: 0 0 150px; padding: 14px; border-radius: var(--r-16); background: var(--surface); border: 1px solid var(--border);
  text-align: center; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s;
}
.fav-card:hover { transform: translateY(-2px); border-color: var(--primary); }
.fav-av { width: 44px; height: 44px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 15px; display: grid; place-items: center; margin: 0 auto 8px; }
.fav-name { font-size: 13px; font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fav-bank { font-size: 11px; color: var(--muted); display: block; margin-top: 2px; }
</style>
</head>
<body data-page="transfer">
<div class="app">
  <main class="main">
    <header class="topbar">
      <div class="greeting page-title">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Dashboard</a><span data-icon="chevR" data-size="12"></span><b>Fund Transfer</b></nav>
        <h1>Fund Transfer</h1>
      </div>
    </header>

    <div class="fth-bar">
      <h3>Favourites</h3>
      <div class="st-actions">
        <a class="btn-sec btn-sm" href="beneficiaries.html"><span data-icon="users" data-size="15"></span>Beneficiaries</a>
        <a class="btn-sec btn-sm" href="limits.html"><span data-icon="gauge" data-size="15"></span>Limits</a>
        <a class="btn-sec btn-sm" href="history.html"><span data-icon="history" data-size="15"></span>History</a>
      </div>
    </div>
    <div class="fav-track" id="fthFavTrack"></div>

    <h3 class="fth-h">Send money to</h3>
    <div class="fth-grid">
      <a href="fund-transfer-own.html" class="fth-card">
        <div class="fth-ic czb"><svg viewBox="0 0 611 438" width="24" height="17" fill="currentColor"><path d="M219 0L375 156 339 192 219 73 73 219 219 365 277 309 313 345 219 438 0 219Z M458 130L611 283 458 436 193 171 228 135 458 364 538 284 458 204 404 257 368 221Z"/></svg></div>
        <div class="fth-title"><b>Citizens Bank</b><small>Own &amp; other CZB accounts</small></div>
        <span class="chip ok">Free · Instant</span>
        <span class="fth-go" data-icon="arrowR" data-size="18"></span>
      </a>
      <a href="fund-transfer-other.html" class="fth-card">
        <div class="fth-ic other"><span data-icon="landmark" data-size="22"></span></div>
        <div class="fth-title"><b>Other Bank</b><small>NPSB · BEFTN · RTGS</small></div>
        <span class="chip ok">NPSB instant</span>
        <span class="fth-go" data-icon="arrowR" data-size="18"></span>
      </a>
      <div class="fth-card" role="button" tabindex="0" id="cardMfsTransfer">
        <div class="fth-ic mfs"><span data-icon="phone" data-size="22"></span></div>
        <div class="fth-title"><b>Mobile Wallet</b><small>bKash · Nagad · Rocket</small></div>
        <span class="chip ok">Instant</span>
        <span class="fth-go" data-icon="arrowR" data-size="18"></span>
      </div>
    </div>
  </main>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function() {
  var $ = cb.$, D = window.CB_DATA;
  var favs = D.beneficiaries.filter(function(b) { return b.fav; });

  var COLORS = ["#93212a", "#0ea5e9", "#f97316", "#16a34a", "#6366f1", "#db2777"];

  var favHtml = favs.map(function(b, i) {
    var ini = b.name.split(" ").slice(0, 2).map(function(w) { return w[0]; }).join("").toUpperCase();
    var href = b.group === 1 ? "fund-transfer-own.html" : "fund-transfer-other.html";
    return '<a href="' + href + '" class="fav-card">' +
      '<div class="fav-av" style="background:' + COLORS[i % COLORS.length] + '">' + ini + '</div>' +
      '<span class="fav-name">' + cb.esc(b.nick || b.name) + '</span>' +
      '<span class="fav-bank">' + cb.esc(b.bank) + '</span>' +
    '</a>';
  }).join("") +
  '<a href="beneficiary-add.html" class="fav-card" style="border:1.5px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center">' +
    '<div class="fav-av" style="background:var(--primary-soft);color:var(--primary)">' + cb.icon("plus", 20) + '</div>' +
    '<span class="fav-name">Add payee</span>' +
  '</a>';

  $("#fthFavTrack").innerHTML = favHtml;

  // MFS Quick Transfer Modal
  $("#cardMfsTransfer").addEventListener("click", function() {
    var mfsBens = D.beneficiaries.filter(function(b) { return b.group === 3; });
    cb.dialog({
      title: "Send to wallet",
      icon: "phone",
      size: "sm",
      html: '<div style="text-align:left">' +
        '<div style="display:grid;gap:10px">' +
          mfsBens.map(function(m) {
            return '<div class="list-row" style="cursor:pointer;border:1px solid var(--border);border-radius:var(--r-12);padding:10px 14px" data-mfs="' + m.name + '">' +
              '<span class="lr-ic" style="background:var(--primary-soft);color:var(--primary)">' + cb.icon("phone", 16) + '</span>' +
              '<span class="lr-t"><b>' + m.name + '</b><small>' + m.bank + ' · ' + m.acc + '</small></span>' +
              '<span class="btn-pri btn-sm" style="padding:4px 10px;font-size:12px">Send</span>' +
            '</div>';
          }).join("") +
        '</div>' +
        '<div style="margin-top:14px;text-align:center"><a href="beneficiary-add.html" class="link" style="font-size:13px">+ Add wallet</a></div>' +
      '</div>',
      buttons: [{ text: "Close", primary: false }]
    });
  });

  document.addEventListener("click", function(e) {
    var row = e.target.closest("[data-mfs]");
    if (row) {
      location.href = "fund-transfer-other.html";
    }
  });
})();
</script>
</body>
</html>
