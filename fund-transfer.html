<style>
.fth-h { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 14px; }
.fth-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.fth-card {
  display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 14px; row-gap: 6px; align-items: center;
  padding: 18px 20px; border-radius: var(--r-16); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
  text-decoration: none; color: inherit; cursor: pointer; transition: transform .18s, box-shadow .18s, border-color .18s;
}
.fth-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.07); border-color: color-mix(in srgb, var(--primary) 30%, var(--border)); }
.fth-ic { grid-row: 1 / 3; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; }
.fth-ic svg { width: 20px; height: 20px; }
.fth-ic.czb { background: linear-gradient(135deg, #5a1018, #8b1c1c); }
.fth-ic.other { background: linear-gradient(135deg, #064e3b, #10b981); }
.fth-ic.mfs { background: linear-gradient(135deg, #312e81, #818cf8); }
.fth-title b { font-size: 14.5px; display: block; font-weight: 600; color: var(--text); }
.fth-title small { font-size: 12px; color: var(--muted); }
.fth-card .chip { grid-column: 2; grid-row: 2; justify-self: start; }
.fth-go { grid-column: 3; grid-row: 1 / 3; color: var(--muted); display: grid; transition: transform .18s, color .18s; }
.fth-card:hover .fth-go { color: var(--primary); transform: translateX(3px); }
.fth-hist { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 16px 20px; border-radius: var(--r-16); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); text-decoration: none; color: inherit; transition: transform .18s, box-shadow .18s, border-color .18s; }
.fth-hist:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.07); border-color: color-mix(in srgb, var(--primary) 30%, var(--border)); }
.fth-hist .fth-ic { background: var(--primary-soft); color: var(--primary); }
.fth-hist .fth-title { flex: 1; min-width: 0; }
.fth-hist:hover .fth-go { color: var(--primary); transform: translateX(3px); }
</style>
</head>
<body data-page="transfer">
<div class="app">
  <main class="main">
    <header class="topbar">
      <div class="greeting page-title">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Dashboard</a><span data-icon="chevR" data-size="12"></span><b>Fund Transfer</b></nav>
        <h1>Fund Transfer</h1>
      </div>
    </header>

    <h3 class="fth-h">Send money to</h3>
    <div class="fth-grid">
      <a href="fund-transfer-own.html" class="fth-card">
        <div class="fth-ic czb"><svg viewBox="0 0 611 438" width="24" height="17" fill="currentColor"><path d="M219 0L375 156 339 192 219 73 73 219 219 365 277 309 313 345 219 438 0 219Z M458 130L611 283 458 436 193 171 228 135 458 364 538 284 458 204 404 257 368 221Z"/></svg></div>
        <div class="fth-title"><b>Citizens Bank</b><small>Own &amp; other CZB accounts</small></div>
        <span class="chip ok">Free · Instant</span>
        <span class="fth-go" data-icon="arrowR" data-size="18"></span>
      </a>
      <a href="fund-transfer-other.html" class="fth-card">
        <div class="fth-ic other"><span data-icon="landmark" data-size="22"></span></div>
        <div class="fth-title"><b>Other Bank</b><small>NPSB · BEFTN · RTGS</small></div>
        <span class="chip ok">NPSB instant</span>
        <span class="fth-go" data-icon="arrowR" data-size="18"></span>
      </a>
      <a href="fund-transfer-mfs.html" class="fth-card">
        <div class="fth-ic mfs"><span data-icon="phone" data-size="22"></span></div>
        <div class="fth-title"><b>MFS</b><small>bKash, Nagad, TapTap, Upay, Rocket</small></div>
        <span class="chip ok">Instant</span>
        <span class="fth-go" data-icon="arrowR" data-size="18"></span>
      </a>
    </div>
    <a href="history.html#payment" class="fth-hist">
      <div class="fth-ic"><span data-icon="history" data-size="22"></span></div>
      <div class="fth-title"><b>Transfer History</b><small>View your past transfers</small></div>
      <span class="fth-go" data-icon="arrowR" data-size="18"></span>
    </a>
  </main>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js?v=11"></script>
</body>
</html>
