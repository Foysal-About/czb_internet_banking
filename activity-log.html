<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Log · Citizens FAST</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-20 -60 651 558'%3E%3Cpath fill='%238b1c1c' d='M219 0L375 156 339 192 219 73 73 219 219 365 277 309 313 345 219 438 0 219Z M458 130L611 283 458 436 193 171 228 135 458 364 538 284 458 204 404 257 368 221Z'/%3E%3C/svg%3E">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("citizens-theme")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=30">
<link rel="stylesheet" href="assets/css/settings.css?v=r4">
</head>
<body data-page="activity">
<div class="app">
  <main class="main">
    <header class="topbar">
      <div class="greeting page-title">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Dashboard</a><span data-icon="chevR" data-size="12"></span><a href="settings.html">Settings</a><span data-icon="chevR" data-size="12"></span><b>Activity Log</b></nav>
        <h1>Activity Log</h1>
      </div>
    </header>
    <section class="card">
      <div class="form-grid" id="alFilters">
        <div class="fld"><label for="alType">Type</label><select id="alType"></select></div>
        <div class="fld"><label for="alFrom">From date</label><input type="date" id="alFrom"></div>
        <div class="fld"><label for="alTo">To date</label><input type="date" id="alTo"></div>
        <div class="fld" style="justify-content:flex-end"><div class="in-group"><button class="btn-sec" id="alReset" type="button">Reset</button><button class="btn-sec" id="alCsv" type="button"><span data-icon="download" data-size="16"></span>Export CSV</button></div></div>
      </div>
      <div class="err" id="alErr"></div>
    </section>
    <section class="card" style="margin-top:20px">
      <div class="al-bar"><div class="card-title" id="alCount"></div></div>
      <div class="al-list" id="alList"></div>
      <div class="empty-state" id="alEmpty" hidden><div class="es-ic" data-icon="activity" data-size="24"></div><b>No activity found</b><p>Try another type or date range.</p></div>
      <div class="al-more" id="alMore" hidden><button class="btn-sec btn-sm" id="alMoreBtn" type="button">See more</button><small id="alShown"></small></div>
    </section>
  </main>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js?v=8"></script>
<script src="assets/js/activity-log.js"></script>
</body>
</html>
