<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Cards · Citizens FAST</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-20 -60 651 558'%3E%3Cpath fill='%238b1c1c' d='M219 0L375 156 339 192 219 73 73 219 219 365 277 309 313 345 219 438 0 219Z M458 130L611 283 458 436 193 171 228 135 458 364 538 284 458 204 404 257 368 221Z'/%3E%3C/svg%3E">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("citizens-theme")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=29">
<link rel="stylesheet" href="assets/css/services.css?v=r4">
<link rel="stylesheet" href="assets/css/cards.css?v=r2">
</head>
<body data-page="cards">
<div class="app">
  <main class="main">
    <header class="topbar">
      <div class="greeting page-title">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Dashboard</a><span data-icon="chevR" data-size="12"></span><span>Cards</span><span data-icon="chevR" data-size="12"></span><b>My Cards</b></nav>
        <h1>My Cards</h1>
      </div>
    </header>
    <section class="cd-section">
      <div class="cd-track" id="cdTrack" role="listbox" aria-label="Your cards"></div>
    </section>

    <div class="two-col cd-main">
      <div class="cd-left">
        <div class="card" id="cdDetails"></div>

        <div class="card cd-add" id="add" hidden>
          <div class="card-head"><h3>Add Card</h3><button type="button" class="btn-link" id="cdAddClose">Close</button></div>
          <p class="muted cd-lead">Link a new card to Citizens FAST. Your PIN is never stored.</p>
          <form id="cdAddForm" class="form-grid" novalidate autocomplete="off">
            <div class="fld full"><label for="cdNo">Card number</label><input id="cdNo" inputmode="numeric" maxlength="19" placeholder="0000 0000 0000 0000"><span class="ferr" data-e="no"></span></div>
            <div class="fld"><label for="cdExp">Expiry (MM/YY)</label><input id="cdExp" inputmode="numeric" maxlength="5" placeholder="MM/YY"><span class="ferr" data-e="exp"></span></div>
            <div class="fld"><label for="cdPin">Card PIN</label><div class="pass-in"><input id="cdPin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" autocomplete="new-password"><button type="button" data-toggle-pass></button></div><span class="ferr" data-e="pin"></span></div>
            <div class="full cd-actions"><button type="button" class="btn-sec" id="cdAddCancel">Cancel</button><button type="submit" class="btn-pri">Add Card</button></div>
          </form>
        </div>

        <div class="card" id="cdTx">
          <div class="card-head"><h3>Card transactions</h3><button type="button" class="btn-link" id="cdDl"><span data-icon="download" data-size="16"></span>Download statement</button></div>
          <div class="cd-filter">
            <div class="fld"><label for="cdFrom">From</label><input type="date" id="cdFrom"></div>
            <div class="fld"><label for="cdTo">To</label><input type="date" id="cdTo"></div>
            <button type="button" class="btn-pri btn-sm" id="cdView">View Transactions</button>
          </div>
          <div class="cd-tx-wrap"><table class="dtable"><thead><tr><th>Date</th><th>Description</th><th class="hide-m">Type</th><th class="r">Amount</th></tr></thead><tbody id="cdTxBody"></tbody></table></div>
          <div class="empty-state" id="cdTxEmpty" hidden><div class="es-ic" data-icon="receipt" data-size="24"></div><b>No transactions found</b><p>Try a wider date range.</p></div>
        </div>
      </div>

      <aside class="cd-side">
        <div class="card">
          <div class="card-head"><h3>More services</h3></div>
          <div class="cd-more" id="cdMore"></div>
        </div>
      </aside>
    </div>
  </main>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js?v=8"></script>
<script src="assets/js/cards.js"></script>
</body>
</html>
