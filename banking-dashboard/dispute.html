<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispute · Citizens FAST</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-20 -60 651 558'%3E%3Cpath fill='%238b1c1c' d='M219 0L375 156 339 192 219 73 73 219 219 365 277 309 313 345 219 438 0 219Z M458 130L611 283 458 436 193 171 228 135 458 364 538 284 458 204 404 257 368 221Z'/%3E%3C/svg%3E">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("citizens-theme")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/css/requests.css">
</head>
<body data-page="dispute">
<div class="app">
  <main class="main">
    <header class="topbar">
      <div class="greeting page-title">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Dashboard</a><span data-icon="chevR" data-size="12"></span><span>Requests</span><span data-icon="chevR" data-size="12"></span><b>Dispute</b></nav>
        <h1>Dispute a Transaction</h1>
      </div>
    </header>
    <div class="ft-layout">
      <div class="card ft-main rq-form">
        <section class="ft-step on" data-step="1">
<div class="ft-block"><div class="ft-label"><b>Account</b><span>Account the transaction was made from</span></div><div class="fld" id="facc"><label>Source account <span class="req">*</span></label><div id="acc"></div><span class="help" id="accHelp" hidden></span><span class="ferr"></span></div></div><div class="ft-block"><div class="ft-label"><b>Transaction</b><span></span></div><div class="form-grid"><div class="fld" id="ftype"><label>Dispute type <span class="req">*</span></label><div id="type"></div><span class="help" id="typeHelp" hidden></span><span class="ferr"></span></div><div class="fld" id="fdate"><label>Transaction date <span class="req">*</span></label><input id="date" type="date" max="" aria-label="Transaction date"><span class="ferr"></span></div><div class="full"><div class="fld" id="famount"><label>Disputed amount <span class="req">*</span></label><div class="amount-in"><span>৳</span><input id="amount" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="Disputed amount"></div><div class="words"></div><div class="chips"></div><span class="ferr"></span></div></div><div class="full"><div class="fld" id="fnarr"><label>Narration <span class="req">*</span></label><textarea id="narr" placeholder="Describe what happened"></textarea><div class="rq-count" id="narrCnt"></div><span class="ferr"></span></div></div></div></div>
<div class="ft-actions"><a class="btn-sec" href="requests.html">Cancel</a><button type="button" class="btn-pri" id="next" disabled>Next</button></div>
        </section>
      </div>
      <aside class="ft-side" id="side"></aside>
    </div>
  </main>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/js/req-flow.js"></script>
<script src="assets/js/dispute.js"></script>
</body>
</html>
