<div class="app">
  <main class="main">
    <header class="topbar">
      <div class="greeting page-title">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="index.html">Dashboard</a>
          <span data-icon="chevR" data-size="12"></span>

    <div class="lmt-page">
      <!-- Clean Summary Strip -->
      <section class="lmt-summary-strip" aria-label="Daily limit overview">
        <div class="lmt-sum-item">
          <span class="lmt-sum-label">Daily Transfer Limit</span>
          <b class="lmt-sum-val num">৳1,000,000.00</b>
        </div>
        <div class="lmt-sum-item">
          <span class="lmt-sum-label">Used Today</span>
          <b class="lmt-sum-val num" id="stripUsed">৳162,840.00</b>

        <div class="lmt-sum-item highlight">
          <span class="lmt-sum-label">Available Today</span>
          <b class="lmt-sum-val num" id="stripAvailable">৳837,160.00</b>
        </div>
        <div class="lmt-sum-item">
          <span class="lmt-sum-label">Daily Reset</span>
          <b class="lmt-sum-val" id="stripReset">Midnight (00:00 BST)</b>
        </div>
      </section>

      <!-- Limit Cards Grid -->
      <section class="lmt-cards-grid" id="lmtGrid" aria-label="Transaction limits"></section>
