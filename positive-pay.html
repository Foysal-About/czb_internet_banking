<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Positive Pay · Citizens FAST</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-20 -60 651 558'%3E%3Cpath fill='%238b1c1c' d='M219 0L375 156 339 192 219 73 73 219 219 365 277 309 313 345 219 438 0 219Z M458 130L611 283 458 436 193 171 228 135 458 364 538 284 458 204 404 257 368 221Z'/%3E%3C/svg%3E">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("citizens-theme")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=16">
<link rel="stylesheet" href="assets/css/requests.css?v=r2">
</head>
<body data-page="positive-pay">
<div class="app">
  <main class="main">
    <header class="topbar">
      <div class="greeting page-title">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Dashboard</a><span data-icon="chevR" data-size="12"></span><span>Cheques</span><span data-icon="chevR" data-size="12"></span><b>Positive Pay</b></nav>
        <h1>Positive Pay</h1>
      </div>
    </header>
    <div class="ft-layout">
      <div class="card ft-main rq-form">
        <section class="ft-step on" data-step="1">
<div class="alert-bar"><span data-icon="shieldCheck" data-size="18"></span><span>Register a cheque with us before you hand it over. <b>We only pay a cheque that matches</b> the amount, date and beneficiary you give here.</span></div><div class="ft-block"><div class="ft-label"><b>Account</b><span></span></div><div class="fld" id="facc"><label>Source account <span class="req">*</span></label><div id="acc"></div><span class="help" id="accHelp" hidden></span><span class="ferr"></span></div></div><div class="ft-block"><div class="ft-label"><b>Cheque</b><span></span></div><div class="form-grid"><div class="fld" id="fbook"><label>Cheque book <span class="req">*</span></label><div id="book"></div><span class="help" id="bookHelp" hidden></span><span class="ferr"></span></div><div class="fld" id="fchq"><label>Unused cheque <span class="req">*</span></label><div id="chq"></div><span class="help" id="chqHelp" hidden></span><span class="ferr"></span></div></div></div><div class="ft-block"><div class="ft-label"><b>Details</b><span></span></div><div class="form-grid"><div class="full"><div class="fld" id="famount"><label>Cheque amount <span class="req">*</span></label><div class="amount-in"><span>৳</span><input id="amount" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="Cheque amount"></div><div class="words"></div><div class="chips"></div><span class="ferr"></span></div></div><div class="fld" id="fstart"><label>Start date <span class="req">*</span></label><input id="start" type="date" max="" aria-label="Start date"><span class="ferr"></span></div><div class="fld" id="fend"><label>End date <span class="req">*</span></label><input id="end" type="date" max="" aria-label="End date"><span class="ferr"></span></div><div class="full"><div class="fld" id="fben"><label>Beneficiary name <span class="req">*</span></label><input id="ben" type="text" placeholder="Name as written on the cheque" autocomplete="off" maxlength="60"><span class="ferr"></span></div></div></div></div>
<div class="ft-actions"><a class="btn-sec" href="requests.html">Cancel</a><button type="button" class="btn-pri" id="next" disabled>Next</button></div>
        </section>
      </div>
      <aside class="ft-side" id="side"></aside>
    </div>
  </main>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/js/req-flow.js"></script>
<script src="assets/js/positive-pay.js"></script>
</body>
</html>
