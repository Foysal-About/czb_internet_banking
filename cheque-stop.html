<div class="app">

      <div class="greeting page-title">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Dashboard</a><span data-icon="chevR" data-size="12"></span><span>Cheques</span><span data-icon="chevR" data-size="12"></span><b>Stop Cheque</b></nav>

    </header>
    <div class="ft-layout">
      <div class="card ft-main rq-form">
        <section class="ft-step on" data-step="1">
<div class="ft-block"><div class="ft-label"><b>Account</b><span>Account the cheque was issued from</span></div><div class="fld" id="facc"><label>Source account <span class="req">*</span></label><div id="acc"></div><span class="help" id="accHelp" hidden></span><span class="ferr"></span></div></div><div class="ft-block"><div class="ft-label"><b>Cheque</b><span>Pick the book and the leaf to stop</span></div><div class="form-grid"><div class="fld" id="fbook"><label>Cheque book <span class="req">*</span></label><div id="book"></div><span class="help" id="bookHelp" hidden></span><span class="ferr"></span></div><div class="fld" id="fchq"><label>Unused cheque <span class="req">*</span></label><div id="chq"></div><span class="help" id="chqHelp" hidden></span><span class="ferr"></span></div></div></div><div class="ft-block"><div class="ft-label"><b>Details</b><span></span></div><div class="form-grid"><div class="full"><div class="fld" id="famount"><label>Cheque amount <span class="req">*</span></label><div class="amount-in"><span>৳</span><input id="amount" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="Cheque amount"></div><div class="words"></div><div class="chips"></div><span class="ferr"></span></div></div><div class="full"><div class="fld" id="freason"><label>Reason <span class="req">*</span></label><textarea id="reason" placeholder="Why do you want to stop this cheque?"></textarea><div class="rq-count" id="reasonCnt"></div><span class="ferr"></span></div></div></div></div>
