<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Card · Citizens FAST</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-20 -60 651 558'%3E%3Cpath fill='%238b1c1c' d='M219 0L375 156 339 192 219 73 73 219 219 365 277 309 313 345 219 438 0 219Z M458 130L611 283 458 436 193 171 228 135 458 364 538 284 458 204 404 257 368 221Z'/%3E%3C/svg%3E">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("citizens-theme")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=30">
<link rel="stylesheet" href="assets/css/services.css?v=r4">
<link rel="stylesheet" href="assets/css/cards.css?v=r4">
</head>
<body data-page="cards-add">
<div class="app">
  <main class="main">
    <header class="topbar">
      <div class="greeting page-title">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Dashboard</a><span data-icon="chevR" data-size="12"></span><a href="cards.html">Cards</a><span data-icon="chevR" data-size="12"></span><b>Add Card</b></nav>
        <h1>Add Card</h1>
      </div>
    </header>

    <div class="ft-layout">
      <section class="card ft-main cd-add-page">
        <div class="rv-head">
          <span class="rv-ic" data-icon="cardPlus" data-size="22"></span>
          <div>
            <h2>Link a Card</h2>
            <p>Link a Citizens Bank debit or credit card to Citizens FAST. Your PIN is only used for verification and is never stored.</p>
          </div>
        </div>
        <form id="cdAddForm" class="form-grid" novalidate autocomplete="off">
          <div class="fld full">
            <label for="cdNo">Card number <span class="req">*</span></label>
            <input id="cdNo" inputmode="numeric" maxlength="19" placeholder="0000 0000 0000 0000" autofocus>
            <span class="ferr" data-e="no"></span>
          </div>
          <div class="fld exp-fld">
            <label for="cdExp">Expiry (MM/YY) <span class="req">*</span></label>
            <div class="exp-wrap" id="cdExpWrap">
              <div class="exp-in">
                <input id="cdExp" inputmode="numeric" maxlength="5" placeholder="MM/YY" autocomplete="off">
                <button type="button" class="exp-cal-btn" id="cdExpBtn" aria-label="Select expiry month and year" aria-haspopup="dialog" aria-expanded="false">
                  <span data-icon="calendar" data-size="17"></span>
                </button>
              </div>
              <div class="exp-pop" id="cdExpPop" role="dialog" aria-label="Choose expiry month and year" hidden></div>
            </div>
            <span class="ferr" data-e="exp"></span>
          </div>
          <div class="fld">
            <label for="cdPin">Card PIN <span class="req">*</span></label>
            <div class="pass-in">
              <input id="cdPin" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" autocomplete="new-password">
              <button type="button" data-toggle-pass></button>
            </div>
            <span class="ferr" data-e="pin"></span>
          </div>
          <div class="full ft-actions">
            <a class="btn-sec" href="cards.html">Cancel</a>
            <button type="submit" class="btn-pri">Add Card</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js?v=10"></script>
<script src="assets/js/card-add.js?v=2"></script>
</body>
</html>
