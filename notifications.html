<body data-page="notifications">
<div class="app">
  <main class="main">
    <header class="topbar">
      <div class="greeting page-title">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Dashboard</a><span data-icon="chevR" data-size="12"></span><a href="settings.html">Settings</a><span data-icon="chevR" data-size="12"></span><b>Notifications</b></nav>
        <h1>Notifications</h1>
      </div>

    <section class="card np-card">
      <div class="np-top">
